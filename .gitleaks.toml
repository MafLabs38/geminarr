# Extends gitleaks' default rules. The only exception: the SonarQube project key in the SonarLint connection files, which is a public identifier
# (it names the project on the server) and not a credential. Documented exception: do not widen it without a reason written here.
[extend]
useDefault = true

[allowlist]
description = "SonarQube project key (a public identifier) in the SonarLint connection files"
paths = [
  '''^\.sonarlint/connectedMode\.json$''',
  '''^\.vscode/settings\.json$''',
]
