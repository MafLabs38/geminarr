# Extends gitleaks' default rules. The only exception: the SonarQube project key (a public identifier that names the project on the server, in the
# SonarLint connection files), which the generic rule takes for an API key. The VALUE is allowed, not the files: a token pasted in those files is still found.
# Documented exception: do not widen it without a reason written here.
[extend]
useDefault = true

[allowlist]
description = "The SonarQube project key (a public identifier)"
regexes = [
  '''MafLabs38_geminarr''',
]
