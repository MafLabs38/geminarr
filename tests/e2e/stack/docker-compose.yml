# The stack the end-to-end tests run against: the image built from this repository, with an empty data folder.
name: geminarr-e2e
services:
  # A fake assistant: a synthetic page that needs a sign-in, reachable as `assistant` (the page) and `signin` (the sign-in page, a host of its own).
  assistant:
    image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    working_dir: /app
    command: ['node', 'server.js']
    volumes:
      - ./assistant/server.js:/app/server.js:ro
    # Published only so that a test can end its session, as an expiry would.
    ports:
      - '8091:8081'
    networks:
      default:
        aliases:
          - assistant
          - signin
  # The browser container (ADR 0016): an ordinary Chromium with a web desktop, a person signs in to it by hand. Its web desktop listens on the loopback of its own network namespace, which Geminarr shares.
  # The image is a third party's, pinned by digest (the maintainer chooses it, SPEC Q-18). The ports of Geminarr are published here, since Geminarr uses this namespace.
  browser:
    image: lscr.io/linuxserver/chromium@sha256:ff1b8235e20367c3b660d31892e14428687df75e2d62e274b7d8d40cf5537108
    shm_size: 1gb
    # The hardening of the examples (deploy/), so that the end-to-end test proves that the browser container runs with it.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - KILL
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: '1000'
      PGID: '1000'
      # No login on the web desktop and nothing published for it: Geminarr relays it on a port of its own (8283), behind a cookie that a ticket of the operator's session gives.
      SUBFOLDER: /browser/
      SELKIES_ALLOWED_ORIGINS: https://geminarr.invalid
    volumes:
      # The desktop listens on the loopback of the namespace only (the same script as the deployment examples').
      - ../../../deploy/browser/loopback-only.sh:/custom-cont-init.d/10-loopback-only.sh:ro
    ports:
      - '8282:8282'
      # The desktop's origin (ADR 0019): open to the network, and closed without the cookie that a ticket of the operator's session gives.
      - '8283:8283'
      # Test only: what each user of the namespace can reach (the probes below), to show the egress guard.
      - '127.0.0.1:9224:9224'
      - '127.0.0.1:9225:9225'
    networks:
      default:
        aliases:
          - browser
  # The egress guard (ADR 0020): in the namespace that the two containers share, Geminarr's own process (uid 1654) may reach nothing but the loopback, whatever the network policy of the pod allows
  # for the browser. It runs once, with the one capability that it needs, and exits; Geminarr has no capability and cannot change what it set. One for IPv4, one for IPv6.
  egress-guard:
    image: registry.k8s.io/build-image/distroless-iptables@sha256:4b2a7382d785242e2f865f4231c581c0662d0f287bf5219a2e2413229f53969c
    entrypoint: ['/usr/sbin/iptables-nft-restore', '/rules/rules.v4']
    network_mode: service:browser
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    read_only: true
    tmpfs: [/run]
    restart: 'no'
    volumes:
      - ./egress/rules.v4:/rules/rules.v4:ro
    depends_on:
      - browser
  egress-guard-v6:
    image: registry.k8s.io/build-image/distroless-iptables@sha256:4b2a7382d785242e2f865f4231c581c0662d0f287bf5219a2e2413229f53969c
    entrypoint: ['/usr/sbin/ip6tables-nft-restore', '/rules/rules.v6']
    network_mode: service:browser
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    read_only: true
    tmpfs: [/run]
    restart: 'no'
    volumes:
      - ./egress/rules.v6:/rules/rules.v6:ro
    depends_on:
      - browser
  # Test only: two probes in the namespace, one as Geminarr's user and one as the browser's, each says whether it can open a connection to an address.
  egress-probe-geminarr:
    image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    user: '1654:1654'
    command: ['node', '/probe.js']
    environment:
      PORT: '9224'
    network_mode: service:browser
    volumes:
      - ./egress/probe.js:/probe.js:ro
    depends_on:
      egress-guard:
        condition: service_completed_successfully
      egress-guard-v6:
        condition: service_completed_successfully
  egress-probe-browser:
    image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    user: '1000:1000'
    command: ['node', '/probe.js']
    environment:
      PORT: '9225'
    network_mode: service:browser
    volumes:
      - ./egress/probe.js:/probe.js:ro
    depends_on:
      egress-guard:
        condition: service_completed_successfully
      egress-guard-v6:
        condition: service_completed_successfully
  geminarr:
    build:
      context: ../../..
    # Shares the network namespace of the browser container: the desktop's address is the loopback, never a network.
    network_mode: service:browser
    # The image runs as a non-root user: give it a throw-away data folder it owns.
    tmpfs:
      - /config:uid=1654,gid=1654
    depends_on:
      assistant:
        condition: service_started
      browser:
        condition: service_started
      egress-guard:
        condition: service_completed_successfully
      egress-guard-v6:
        condition: service_completed_successfully
    # The operator, as a real deployment gives it: a name and the password in a mounted file (a test-only value). The tests speak plain HTTP: the cookie cannot be Secure here.
    environment:
      GEMINARR__AUTH__ADMINUSER: e2e-operator
      GEMINARR__AUTH__ADMINPASSWORDFILE: /run/admin-password
      GEMINARR__AUTH__COOKIESECURITY: SameAsRequest
      # The reader is the browser container, and the "assistant" is a fake one on this network (a synthetic page that needs a sign-in, on its own host like the real one).
      GEMINARR__READER__KIND: Web
      GEMINARR__READER__LOGINFAILURES: '1'
      GEMINARR__READER__POLLMINUTES: '1'
      GEMINARR__BROWSER__DESKTOPURL: http://127.0.0.1:3000
      # Test only: the two probes listen off the loopback (they show the egress guard).
      GEMINARR__BROWSER__ALLOWEDOPENPORTS: '9224;9225'
      # Who this environment is, as a real deployment says it: a name and a picture in a mounted file (a synthetic drawing).
      GEMINARR__IDENTITY__NAME: E2E Lab
      GEMINARR__IDENTITY__LOGOFILE: /run/logo.svg
    configs:
      - source: logo
        target: /run/logo.svg
        mode: 0444
      - source: admin_password
        target: /run/admin-password
        mode: 0444
configs:
  logo:
    content: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10" width="10" height="10"><circle cx="5" cy="5" r="4" fill="#3ee0c5"/></svg>'
  admin_password:
    content: e2e-admin-password
