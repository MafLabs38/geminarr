# The stack the end-to-end tests run against: the image built from this repository, the browser container with the extension that a policy installs in it (the way a deployment does it, docs/DEPLOYMENT.md), a fake
# assistant and a fake Mnemarr on the same network. Nothing is real: the assistant and Mnemarr are synthetic, and the key that signs the extension is made for each run. A second instance of the image has no reader,
# no browser and no Mnemarr: what a fresh deployment is.
name: geminarr-e2e
x-node: &node
  image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
networks:
  default:
    ipam:
      config:
        - subnet: 10.254.77.0/24
services:
  # A fake assistant: synthetic pages shaped like the ones that the extension reads (the list, the turns of a conversation, the button of the account). Nobody is signed in to it until a test says so. Published only so that
  # a test can sign it in and out and add a conversation, and ask whether another container can open a port of the browser.
  assistant:
    <<: *node
    working_dir: /app
    command: ['node', 'server.mjs']
    volumes:
      - ./assistant/server.mjs:/app/server.mjs:ro
    ports:
      - '8091:8081'
    networks:
      default:
        aliases:
          - assistant
  # A fake Mnemarr: what a machine sees of the real one, at an address that the egress guard names (the only one that Geminarr's own process may reach). Published only so that a test can read what it holds.
  mnemarr:
    <<: *node
    working_dir: /app
    command: ['node', 'server.mjs']
    volumes:
      - ./mnemarr/server.mjs:/app/server.mjs:ro
    ports:
      - '8092:8090'
    networks:
      default:
        ipv4_address: 10.254.77.10
  # Packs the extension for the origin of the fake assistant with a key made now, and writes the policy of the browser (the id of the extension comes from the key).
  prepare:
    <<: *node
    working_dir: /stack
    environment:
      TOKEN: e2e-extension-token-e2e-extension-token
      # Geminarr is in the namespace of the browser: the extension reaches it on the loopback.
      GEMINARR_URL: http://127.0.0.1:8282
      ASSISTANT_ORIGIN: http://assistant:8081
    volumes:
      - ./extension/prepare.mjs:/stack/tests/e2e/stack/extension/prepare.mjs:ro
      - ../../../tools/extension/pack.mjs:/stack/tools/extension/pack.mjs:ro
      - ../../../extension:/extension-source:ro
      - package:/package
      - policy:/policy
    # The path of the script under /stack keeps the relative import of prepare.mjs what it is in the repository.
    entrypoint: ['node', '/stack/tests/e2e/stack/extension/prepare.mjs']
  # The browser container (ADR 0016): an ordinary Chromium with a web desktop, that a person signs in to by hand, with the policy that installs the extension. Its web desktop listens on the loopback of its own network
  # namespace, which Geminarr shares. The image is a third party's, pinned by digest (the maintainer chooses it, SPEC Q-18). The ports of Geminarr are published here, since Geminarr uses this namespace.
  browser:
    image: lscr.io/linuxserver/chromium@sha256:ff1b8235e20367c3b660d31892e14428687df75e2d62e274b7d8d40cf5537108
    shm_size: 1gb
    # The hardening of the examples (deploy/), so that the end-to-end test proves that the browser container runs with it.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - KILL
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: '1000'
      PGID: '1000'
      # No login on the web desktop and nothing published for it: Geminarr relays it on a port of its own (8283), behind a cookie that a ticket of the operator's session gives.
      SUBFOLDER: /browser/
      SELKIES_ALLOWED_ORIGINS: https://geminarr.invalid
    volumes:
      # The desktop listens on the loopback of the namespace only (the same script as the deployment examples').
      - ../../../deploy/browser/loopback-only.sh:/custom-cont-init.d/10-loopback-only.sh:ro
      - policy:/etc/chromium/policies/managed:ro
    ports:
      - '8282:8282'
      # The desktop's origin (ADR 0019): open to the network, and closed without the cookie that a ticket of the operator's session gives.
      - '8283:8283'
      # Test only: what each user of the namespace can reach (the probes below), to show the egress guard.
      - '127.0.0.1:9224:9224'
      - '127.0.0.1:9225:9225'
    depends_on:
      assistant:
        condition: service_started
      prepare:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - browser
  # The egress guard (ADR 0020): in the namespace that the two containers share, Geminarr's own process (uid 1654) may reach nothing but the loopback, whatever the network policy of the pod allows
  # for the browser. It runs once, with the one capability that it needs, and exits; Geminarr has no capability and cannot change what it set. One for IPv4, one for IPv6.
  egress-guard:
    image: registry.k8s.io/build-image/distroless-iptables@sha256:4b2a7382d785242e2f865f4231c581c0662d0f287bf5219a2e2413229f53969c
    entrypoint: ['/usr/sbin/iptables-nft-restore', '/rules/rules.v4']
    network_mode: service:browser
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    read_only: true
    tmpfs: [/run]
    restart: 'no'
    volumes:
      - ./egress/rules.v4:/rules/rules.v4:ro
    depends_on:
      - browser
  egress-guard-v6:
    image: registry.k8s.io/build-image/distroless-iptables@sha256:4b2a7382d785242e2f865f4231c581c0662d0f287bf5219a2e2413229f53969c
    entrypoint: ['/usr/sbin/ip6tables-nft-restore', '/rules/rules.v6']
    network_mode: service:browser
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    read_only: true
    tmpfs: [/run]
    restart: 'no'
    volumes:
      - ./egress/rules.v6:/rules/rules.v6:ro
    depends_on:
      - browser
  # Test only: two probes in the namespace, one as Geminarr's user and one as the browser's, each says whether it can open a connection to an address.
  egress-probe-geminarr:
    image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    user: '1654:1654'
    command: ['node', '/probe.js']
    environment:
      PORT: '9224'
    network_mode: service:browser
    volumes:
      - ./egress/probe.js:/probe.js:ro
    depends_on:
      egress-guard:
        condition: service_completed_successfully
      egress-guard-v6:
        condition: service_completed_successfully
  egress-probe-browser:
    image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    user: '1000:1000'
    command: ['node', '/probe.js']
    environment:
      PORT: '9225'
    network_mode: service:browser
    volumes:
      - ./egress/probe.js:/probe.js:ro
    depends_on:
      egress-guard:
        condition: service_completed_successfully
      egress-guard-v6:
        condition: service_completed_successfully
  geminarr:
    image: geminarr-e2e:ci
    build:
      context: ../../..
    # Shares the network namespace of the browser container: the desktop's address and its own are the loopback, never a network.
    network_mode: service:browser
    # The image runs as a non-root user: give it a throw-away data folder it owns.
    tmpfs:
      - /config:uid=1654,gid=1654
    volumes:
      - package:/extension:ro
    depends_on:
      assistant:
        condition: service_started
      browser:
        condition: service_started
      mnemarr:
        condition: service_started
      egress-guard:
        condition: service_completed_successfully
      egress-guard-v6:
        condition: service_completed_successfully
    # The operator, as a real deployment gives it: a name and the password in a mounted file (a test-only value). The tests speak plain HTTP: the cookie cannot be Secure here.
    environment:
      GEMINARR__AUTH__ADMINUSER: e2e-operator
      GEMINARR__AUTH__ADMINPASSWORDFILE: /run/admin-password
      GEMINARR__AUTH__COOKIESECURITY: SameAsRequest
      # The reader is the extension of the browser container, with its token in a file and its package in the folder that the preparation wrote.
      GEMINARR__READER__KIND: Web
      # One pass that finds nobody signed in is enough to say "sign in again" (three by default), so that a test does not wait for three rounds.
      GEMINARR__READER__LOGINFAILURES: '1'
      GEMINARR__EXTENSION__TOKENFILE: /run/extension-token
      GEMINARR__EXTENSION__PACKAGEFOLDER: /extension
      # A round every minute (fifteen by default), so that a test does not wait a quarter of an hour for a conversation that was added.
      GEMINARR__EXTENSION__ROUNDMINUTES: '1'
      GEMINARR__BROWSER__DESKTOPURL: http://127.0.0.1:3000
      # Test only: the two probes listen off the loopback (they show the egress guard).
      GEMINARR__BROWSER__ALLOWEDOPENPORTS: '9224;9225'
      # The Mnemarr of the stack speaks plain HTTP on a private network, for the tests only; the egress guard names its address.
      GEMINARR__MNEMARR__URL: http://10.254.77.10:8090
      GEMINARR__MNEMARR__ALLOWINSECUREHTTP: 'true'
      GEMINARR__MNEMARR__ENROLMENTCODEFILE: /run/mnemarr-code
      # Who this environment is, as a real deployment says it: a name and a picture in a mounted file (a synthetic drawing).
      GEMINARR__IDENTITY__NAME: E2E Lab
      GEMINARR__IDENTITY__LOGOFILE: /run/logo.svg
    configs:
      - source: logo
        target: /run/logo.svg
        mode: 0444
      - source: admin_password
        target: /run/admin-password
        mode: 0444
      - source: extension_token
        target: /run/extension-token
        mode: 0444
      - source: mnemarr_code
        target: /run/mnemarr-code
        mode: 0444
  # A fresh deployment: no reader, no browser, no Mnemarr (the tests of what a first start says, and of the page where Mnemarr is paired, use this one).
  geminarr-fresh:
    image: geminarr-e2e:ci
    pull_policy: never
    ports:
      - '8284:8282'
    tmpfs:
      - /config:uid=1654,gid=1654
    depends_on:
      geminarr:
        condition: service_started
    environment:
      GEMINARR__AUTH__ADMINUSER: e2e-operator
      GEMINARR__AUTH__ADMINPASSWORDFILE: /run/admin-password
      GEMINARR__AUTH__COOKIESECURITY: SameAsRequest
      GEMINARR__ALLOWEDHOSTNAMES: localhost;127.0.0.1
    configs:
      - source: admin_password
        target: /run/admin-password
        mode: 0444
configs:
  logo:
    content: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10" width="10" height="10"><circle cx="5" cy="5" r="4" fill="#3ee0c5"/></svg>'
  admin_password:
    content: e2e-admin-password
  extension_token:
    content: e2e-extension-token-e2e-extension-token
  mnemarr_code:
    content: E2E-CODE
volumes:
  package:
  policy:
