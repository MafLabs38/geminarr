# The browser that a person signs in to Gemini in, and that the extension of Geminarr reads from (ADR 0015). Next to the Geminarr of docker-compose.example.yml (same file or same network).
# The browser image is a third party's, chosen by you: any Chromium that reads enterprise policies from /etc/chromium/policies/managed. Pin it by digest.
# The policy file holds the token: it is a secret, generated by your tooling from policy.example.json, never committed.
services:
  browser:
    image: <chromium-image>@sha256:<digest>
    restart: unless-stopped
    shm_size: 1gb
    environment:
      PUID: '1000'
      PGID: '1000'
    volumes:
      - browser-profile:/config                                    # the signed-in session of the DEDICATED account: a volume of its own, never backed up in the clear
      - ./geminarr-policy.json:/etc/chromium/policies/managed/geminarr.json:ro
    cap_drop:
      - ALL
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, KILL]    # what the usual Chromium images need; try without
    security_opt:
      - no-new-privileges:true
    # The page of the browser: nothing publishes it here, and **no other container may reach it**: the desktop that these images serve (port 3000 or 3001) has no login unless you give it one
    # (for the linuxserver image, CUSTOM_USER and PASSWORD), and whoever opens it holds the signed-in session. The browser is on a network of its own, shared with Geminarr alone.
    networks:
      - reader
networks:
  reader:                # also given to the geminarr service of docker-compose.example.yml, and to nothing else
volumes:
  browser-profile:
