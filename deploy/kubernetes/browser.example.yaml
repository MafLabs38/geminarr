# The browser that a person signs in to Gemini in, and that the extension of Geminarr reads from (ADR 0015). A pod of its own, next to geminarr.example.yaml.
# The image is a third party's, chosen by you: any Chromium that reads enterprise policies from /etc/chromium/policies/managed. Pin it by digest.
# The policy holds the token: it is a Secret (generated by your tooling from deploy/browser/policy.example.json, sealed in your GitOps repository), never a ConfigMap and never in this repository.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geminarr-browser
  namespace: geminarr
spec:
  replicas: 1
  strategy:
    type: Recreate   # one browser holds the profile
  selector:
    matchLabels:
      app.kubernetes.io/name: geminarr-browser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geminarr-browser
    spec:
      automountServiceAccountToken: false
      containers:
        - name: browser
          image: <chromium-image>@sha256:<digest>
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            # What the usual Chromium images need to start as root and drop to their own user; try without, and keep the list as short as the image allows.
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, KILL]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: profile            # the signed-in session of the DEDICATED account: a volume of its own, never backed up in the clear
              mountPath: /config
            - name: policy
              mountPath: /etc/chromium/policies/managed
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: profile
          persistentVolumeClaim:
            claimName: geminarr-browser-profile
        - name: policy
          secret:
            secretName: geminarr-browser-policy   # a file `geminarr.json`
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
# Nothing may reach the browser: the web desktop that these images serve has no login unless you give it one, and whoever opens it holds the signed-in session. The extension only calls out. (Signing in to the
# dedicated account needs a way in: until the next vertical brings it to Geminarr's page, open one for the time of the sign-in with a policy of your own, never a standing one.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geminarr-browser-ingress
  namespace: geminarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: geminarr-browser
  policyTypes: [Ingress]
---
# What leaves the browser (docs/network.md): DNS, Geminarr, and the assistant's origins and its sign-in; nothing else. The hosts that the assistant's page loads from are in your own list
# (they change; check them with the browser's own network panel): a new destination is a decision.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geminarr-browser-egress
  namespace: geminarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: geminarr-browser
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: geminarr
      ports:
        - protocol: TCP
          port: 8282
    # The assistant's origins and its sign-in over HTTPS: a CIDR list of your own (Google's ranges change; some clusters use an FQDN-aware policy instead).
    - to:
        - ipBlock:
            cidr: <the-ranges-of-the-assistant>
      ports:
        - protocol: TCP
          port: 443
