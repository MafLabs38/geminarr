# Geminarr on Kubernetes. Adjust the values marked <...>, then `kubectl apply -f` (or, better, let your GitOps tool apply it).
# The page (and, from the reader vertical on, the live view where the dedicated account is signed in) must be behind a login:
# publish it behind your single sign-on, and nothing else of it.
apiVersion: v1
kind: Namespace
metadata:
  name: geminarr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geminarr-data
  namespace: geminarr
spec:
  accessModes: [ReadWriteOnce]
  # A local, fast volume: not a network share.
  storageClassName: <local-storage-class>
  resources:
    requests:
      storage: 2Gi
---
---
# The browser profile: the signed-in session of the dedicated Google account. A volume of its own, never in a backup in the clear (ADR 0004, 0015).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geminarr-profile
  namespace: geminarr
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geminarr
  namespace: geminarr
spec:
  replicas: 1
  strategy:
    type: Recreate        # one writer to the database and, later, the one browser profile
  selector:
    matchLabels:
      app.kubernetes.io/name: geminarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geminarr
    spec:
      # Geminarr never calls the Kubernetes API: do not hand a cluster credential to the pod.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: geminarr
          image: ghcr.io/<owner>/geminarr:<tag>   # pin a version
          ports:
            - name: http
              containerPort: 8282
          env:
            - name: GEMINARR__DATAFOLDER
              value: /config
            # The operator: a name that is not obvious, and the password in a mounted secret. Without them nobody can sign in. Rotating the secret needs no restart.
            - name: GEMINARR__AUTH__ADMINUSER
              value: change-me-operator-name
            - name: GEMINARR__AUTH__ADMINPASSWORDFILE
              value: /run/geminarr/operator/password
            # The name you reach the page by: its host is allowed, a request for any other name is refused (the probes are exempt).
            - name: GEMINARR__PUBLICURL
              value: https://geminarr.homelab.example
            # The Mnemarr to send to (https). Leave it out to give the address on the page and pair there; a one-time code or a key can be mounted as a file instead.
            # - name: GEMINARR__MNEMARR__URL
            #   value: https://mnemarr.homelab.example
            # - name: GEMINARR__MNEMARR__KEYFILE            # the key that Mnemarr gave to this machine, from a secret (or GEMINARR__MNEMARR__ENROLMENTCODEFILE for a one-time code)
            #   value: /run/geminarr/mnemarr/key
            # Optional, who this environment is at the bottom of the menu: a name, and a picture (a png, webp or svg of at most 1 MiB) mounted from a ConfigMap or a volume.
            # - name: GEMINARR__IDENTITY__NAME
            #   value: My lab
            # - name: GEMINARR__IDENTITY__LOGOFILE
            #   value: /run/geminarr/identity/logo.png
            # The browser reads the session of the assistant and gives the operator a live view to sign in through: set it to Web (the default, None, reads nothing).
            # - name: GEMINARR__READER__KIND
            #   value: Web
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          readinessProbe:
            # The data folder check is reused for 15 seconds, so a lost volume shows within that time plus one period.
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 1Gi   # the browser (Chromium) needs about 300 MB while it is open
              ephemeral-storage: 512Mi
          volumeMounts:
            - name: data
              mountPath: /config
            - name: profile
              mountPath: /profile
            - name: tmp
              mountPath: /tmp
            - name: operator
              mountPath: /run/geminarr/operator
              readOnly: true
            # - name: mnemarr             # the key (or the code) of the machine, from a secret that holds the file `key`
            #   mountPath: /run/geminarr/mnemarr
            #   readOnly: true
            # - name: identity            # the picture of the menu, from a ConfigMap that holds the file `logo.png`
            #   mountPath: /run/geminarr/identity
            #   readOnly: true
      volumes:
        - name: operator
          secret:
            defaultMode: 0440   # the container's group reads it (fsGroup), no other user of the pod does
            secretName: geminarr-operator   # created by you, or sealed in your GitOps repository: `kubectl -n geminarr create secret generic geminarr-operator --from-file=password=./operator-password`
        # - name: mnemarr
        #   secret:
        #     secretName: geminarr-mnemarr
        #     defaultMode: 0440
        # - name: identity
        #   configMap:
        #     name: geminarr-identity
        - name: data
          persistentVolumeClaim:
            claimName: geminarr-data
        - name: profile
          persistentVolumeClaim:
            claimName: geminarr-profile
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: geminarr
  namespace: geminarr
spec:
  selector:
    app.kubernetes.io/name: geminarr
  ports:
    - name: http
      port: 8282
      targetPort: http
---
# Nothing but the ingress controller (and the platform's probes) may reach the pod: the single sign-on lives at the ingress, so a pod that
# could call the service directly would skip it. Adjust the namespace label to your ingress controller's. The egress policy is the next one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geminarr-ingress
  namespace: geminarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: geminarr
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <ingress-controller-namespace>
      ports:
        - protocol: TCP
          port: 8282
---
# What leaves the pod (SPEC §11.2, docs/network.md): DNS and the Mnemarr it sends to, and nothing else. The assistant's own origins are added with the
# reader (vertical 4), and a new destination is a decision. Adjust the selectors to where DNS and Mnemarr run; for a Mnemarr outside the cluster use an
# `ipBlock` with its address instead of the namespace selector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geminarr-egress
  namespace: geminarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: geminarr
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <mnemarr-namespace>
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mnemarr
      ports:
        - protocol: TCP
          port: 8080
