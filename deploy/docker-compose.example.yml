# Geminarr on a Docker host. Copy, adjust the values marked <...>, then `docker compose up -d`.
# The image runs as a non-root user (uid 1654) with no shell: the data folder must be writable by that user.
services:
  geminarr:
    image: ghcr.io/<owner>/geminarr:<tag>   # pin a version
    restart: unless-stopped
    ports:
      # Loopback only: Geminarr speaks plain HTTP. Publish it through a reverse proxy with TLS and your single sign-on in front,
      # or change the address on purpose. Everything but the probes needs the operator's sign-in.
      - "127.0.0.1:8282:8282"
    volumes:
      # - ./geminarr-logo.png:/run/identity/logo.png:ro   # the picture of the menu (see GEMINARR__IDENTITY__LOGOFILE below); not in git
      - geminarr-data:/config               # database and settings: back this up.
      - geminarr-profile:/profile           # the browser profile: the signed-in session of the dedicated Google account. Its own volume, never in a backup in the clear (SPEC §7.1).
    environment:
      GEMINARR__DATAFOLDER: /config
      # The operator: a name that is not obvious (whoever knows it can lock it out for fifteen minutes) and the password in a file (a secret).
      # Without them nobody can sign in. Rotating the secret needs no restart.
      GEMINARR__AUTH__ADMINUSER: change-me-operator-name
      GEMINARR__AUTH__ADMINPASSWORDFILE: /run/secrets/geminarr_operator_password
      # The name you reach the page by (the host of this address is allowed; a request for any other name is refused). Behind TLS leave the cookie secure.
      GEMINARR__PUBLICURL: https://geminarr.homelab.example
      # The Mnemarr to send to (https). Leave it out to give the address on the page *Mnemarr* and pair there; a one-time code can be given as a file instead.
      # GEMINARR__MNEMARR__URL: https://mnemarr.homelab.example
      # GEMINARR__MNEMARR__ENROLMENTCODEFILE: /run/secrets/geminarr_mnemarr_code   # a one-time code, exchanged at start
      # GEMINARR__MNEMARR__KEYFILE: /run/secrets/geminarr_mnemarr_key             # or the key itself, if Mnemarr gave it to you
      # Optional: who this environment is, at the bottom of the menu (a name, and a picture mounted as a file; none of it is in this repository).
      # GEMINARR__IDENTITY__NAME: My lab
      # GEMINARR__IDENTITY__LOGOFILE: /run/identity/logo.png   # mounted below, from a file next to this one
      # Plain HTTP on the loopback only, for a try: GEMINARR__AUTH__COOKIESECURITY: SameAsRequest
    secrets:
      - geminarr_operator_password
    # Hardening: nothing writes outside the data folder and a temporary folder.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

secrets:
  geminarr_operator_password:
    file: ./geminarr-operator-password   # one line, at least 12 characters; not in git

volumes:
  geminarr-data:
  geminarr-profile:
